# ============================================================
# ГосДок — Docker Compose (раздел 8 ТЗ)
# ============================================================

services:

  # ---- PostgreSQL 16 + pgvector ----
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gosdoc}
      POSTGRES_USER: ${POSTGRES_USER:-gosdoc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gosdoc_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gosdoc_user} -d ${POSTGRES_DB:-gosdoc}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis 7 ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- MeiliSearch ----
  # Образ getmeili/meilisearch — distroless, нет wget/curl, поэтому без
  # healthcheck. Зависящие сервисы используют condition: service_started.
  # Если MeiliSearch не готов к моменту первого обращения — search.py
  # тихо логирует warning и приложение работает без поиска.
  meilisearch:
    image: getmeili/meilisearch:v1.10
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-pwpwlpKRMS63-I8tqFMw0LGFEK9he5iYcew6hLpiR1I}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data

  # ---- Django Backend ----
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://${POSTGRES_USER:-gosdoc_user}:${POSTGRES_PASSWORD:-gosdoc_pass}@db:5432/${POSTGRES_DB:-gosdoc}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --worker-class gthread --threads 8 --timeout 120 --reload"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    # Healthcheck отмечает контейнер healthy только когда gunicorn слушает
    # порт 8000 — а это происходит ПОСЛЕ применения миграций.
    # Поэтому celery/celery-beat могут безопасно ждать "backend healthy",
    # чтобы не лезть в БД без таблиц django_celery_beat.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/api/schema/', timeout=3).status < 500 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started

  # ---- Celery Worker ----
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://${POSTGRES_USER:-gosdoc_user}:${POSTGRES_PASSWORD:-gosdoc_pass}@db:5432/${POSTGRES_DB:-gosdoc}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    command: celery -A config worker -l info --concurrency=4
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  # ---- Celery Beat (планировщик) ----
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://${POSTGRES_USER:-gosdoc_user}:${POSTGRES_PASSWORD:-gosdoc_pass}@db:5432/${POSTGRES_DB:-gosdoc}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  # ---- Frontend (React dev server) ----
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../gosdoc-frontend-new:/app
    ports:
      - "3000:3000"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  postgres_data:
  static_volume:
  media_volume:
  meili_data:
